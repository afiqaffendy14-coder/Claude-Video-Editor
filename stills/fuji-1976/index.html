<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fuji 1976 Still</title>
    <script type="importmap">
      {
        "imports": {
          "three": "../../videos/lauda-sample/lib/three.module.js",
          "three/addons/": "../../videos/lauda-sample/lib/addons/"
        }
      }
    </script>
    <style>
      html, body { margin: 0; background: #111; }
      canvas { display: block; width: 540px; height: 960px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      // Fuji, 24 October 1976. Rain. Lauda has pulled into the pits and climbed out; the race
      // goes on without him. One frame, rendered at 2160×3840 and downsampled for the final.
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { Reflector } from "three/addons/objects/Reflector.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
      import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
      import { ACCENT, RIVAL, buildCar, std, rbox, crease, rod, shadowed } from "../../videos/lauda-sample/scene/models.js";
      import { buildPerson } from "../../videos/lauda-sample/scene/humans.js";
      import { buildHelmet } from "../../videos/lauda-sample/scene/models.js";

      const Q = Number(new URLSearchParams(location.search).get("q") || 1);
      const W = Math.round(2160 * Q), H = Math.round(3840 * Q);
      const at = (mesh, x, y, z) => (mesh.position.set(x, y, z), mesh);
      let seed = 1976;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      const scene = new THREE.Scene();
      const FOG = new THREE.Color("#7c838b");
      scene.fog = new THREE.FogExp2(FOG, 0.026);
      const sky = document.createElement("canvas");
      sky.width = 4; sky.height = 512;
      const sg = sky.getContext("2d");
      const grad = sg.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, "#4f555c");
      grad.addColorStop(0.55, "#747b83");
      grad.addColorStop(1, "#858c94");
      sg.fillStyle = grad;
      sg.fillRect(0, 0, 4, 512);
      scene.background = new THREE.CanvasTexture(sky);
      scene.background.colorSpace = THREE.SRGBColorSpace;
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.45;

      const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 2000);
      camera.position.set(1.7, 1.05, 10.2);
      camera.lookAt(0.3, 1.5, -8);

      // Overcast storm light from behind (backlights the rain), cool fill, warm garage spill.
      scene.add(new THREE.HemisphereLight(0xb3bcc6, 0x2e3033, 1.25));
      const key = new THREE.DirectionalLight(0xdde4ec, 1.7);
      key.position.set(-6, 14, -12);
      key.target.position.set(0, 0, 0);
      key.castShadow = true;
      key.shadow.mapSize.set(4096, 4096);
      Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
      key.shadow.radius = 7;
      key.shadow.bias = -0.0003;
      key.shadow.normalBias = 0.02;
      scene.add(key, key.target);

      // ------------------------------------------------------------- wet ground
      // Mirror plane underneath; a semi-transparent asphalt layer on top whose alpha is a
      // puddle map, so puddles show crisp reflections and the rest a wet sheen.
      const mirror = new Reflector(new THREE.PlaneGeometry(80, 140), {
        textureWidth: W / 2, textureHeight: H / 2, color: 0x7d838a, clipBias: 0.002,
      });
      mirror.rotation.x = -Math.PI / 2;
      mirror.position.set(0, 0, -40);
      scene.add(mirror);

      function puddleMap() {
        const S = 1024, c = document.createElement("canvas");
        c.width = c.height = S;
        const g = c.getContext("2d");
        g.fillStyle = "rgb(205,205,205)"; // wet asphalt: mostly opaque, faint sheen
        g.fillRect(0, 0, S, S);
        for (let i = 0; i < 70; i++) {
          const x = rnd() * S, y = rnd() * S, r = 20 + rnd() * 110;
          const rg = g.createRadialGradient(x, y, r * 0.2, x, y, r);
          rg.addColorStop(0, "rgba(10,10,10,1)");
          rg.addColorStop(0.7, "rgba(40,40,40,0.9)");
          rg.addColorStop(1, "rgba(205,205,205,0)");
          g.fillStyle = rg;
          g.beginPath();
          g.ellipse(x, y, r * (1 + rnd()), r, rnd() * 3, 0, Math.PI * 2);
          g.fill();
        }
        // aggregate speckle so the surface reads as asphalt up close
        const img = g.getImageData(0, 0, S, S);
        for (let i = 0; i < img.data.length; i += 4) {
          const n = (rnd() - 0.5) * 40;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = Math.max(0, Math.min(255, img.data[i] + n));
        }
        g.putImageData(img, 0, 0);
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(5, 9);
        return t;
      }
      const puddles = puddleMap();
      const asphalt = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 140),
        new THREE.MeshPhysicalMaterial({
          color: "#2c2e31", roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.2,
          alphaMap: puddles, transparent: true, bumpMap: puddles, bumpScale: 0.6, depthWrite: false,
        }),
      );
      asphalt.rotation.x = -Math.PI / 2;
      asphalt.position.set(0, 0.003, -40);
      asphalt.receiveShadow = true;
      scene.add(asphalt);

      const paint = new THREE.MeshPhysicalMaterial({ color: "#d9dbdc", roughness: 0.35, clearcoat: 0.8, transparent: true, opacity: 0.85 });
      const line = (w, d, x, z) => {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), paint);
        m.rotation.x = -Math.PI / 2;
        m.position.set(x, 0.005, z);
        scene.add(m);
      };
      line(0.14, 140, -4.2, -40); // pit-lane fast-lane line
      line(0.14, 140, 3.9, -40); // track edge
      for (let z = -100; z < 20; z += 3) line(0.12, 1.4, -1.2, z); // dashed working-lane line

      // ------------------------------------------------------------- pit wall, fence, track
      const concrete = new THREE.MeshPhysicalMaterial({ color: "#8d9093", roughness: 0.5, clearcoat: 0.4 });
      scene.add(shadowed(at(new THREE.Mesh(crease(rbox(0.5, 1.05, 140, 0.03)), concrete), 3.0, 0.525, -40)));
      const steel = std("#6e7276", 0.35, 0.8);
      for (let z = -110; z < 20; z += 2.5) scene.add(shadowed(rod(new THREE.Vector3(3.0, 1.05, z), new THREE.Vector3(3.0, 3.2, z), 0.045, steel, 12)));
      for (let y = 1.25; y <= 3.2; y += 0.11) scene.add(rod(new THREE.Vector3(3.0, y, -110), new THREE.Vector3(3.0, y, 20), 0.006, steel, 4));
      // signalling board hung on the fence, the crew's last message
      const board = new THREE.Mesh(crease(rbox(0.9, 0.6, 0.04, 0.02)), std("#141414", 0.5));
      board.position.set(2.72, 1.75, -4.5);
      board.rotation.y = -0.2;
      scene.add(shadowed(board));
      for (let i = 0; i < 3; i++) {
        const strip = new THREE.Mesh(rbox(0.7, 0.07, 0.01, 0.005), std("#e8e8e4", 0.5));
        strip.position.set(2.7, 1.93 - i * 0.17, -4.47);
        strip.rotation.y = -0.2;
        scene.add(strip);
      }

      // kerbs and the far tyre barrier
      for (let z = -120; z < 20; z += 1.0) {
        const k = new THREE.Mesh(crease(rbox(0.7, 0.06, 1.0, 0.015)), new THREE.MeshPhysicalMaterial({ color: Math.round(z) % 2 ? "#e9e9e6" : "#55585c", roughness: 0.35, clearcoat: 0.8 }));
        k.position.set(12.4, 0.03, z);
        scene.add(k);
      }
      const tyreGeo = new THREE.TorusGeometry(0.28, 0.13, 12, 24);
      const tyreMat = std("#131313", 0.75);
      for (let z = -120; z < 20; z += 0.64) for (let k = 0; k < 3; k++) {
        const t = new THREE.Mesh(tyreGeo, tyreMat);
        t.rotation.x = Math.PI / 2;
        t.position.set(13.6, 0.13 + k * 0.26, z);
        scene.add(t);
      }

      // grandstand across the track, dissolving into the rain
      const stand = new THREE.Group();
      for (let i = 0; i < 14; i++) {
        const h = 0.8 + i * 0.6;
        const step = new THREE.Mesh(crease(rbox(1.2, h, 150, 0.02)), std("#73787d", 0.8));
        step.position.set(17 + i * 1.2, h / 2, -45);
        stand.add(step);
      }
      const roof = new THREE.Mesh(crease(rbox(19, 0.4, 152, 0.05)), std("#5d6267", 0.6));
      roof.position.set(25.5, 12.5, -45);
      roof.rotation.z = 0.07;
      stand.add(roof);
      scene.add(shadowed(stand));

      // ------------------------------------------------------------- garages (left)
      const garages = new THREE.Group();
      const facade = new THREE.MeshPhysicalMaterial({ color: "#a7aaad", roughness: 0.6, clearcoat: 0.2 });
      const warm = new THREE.MeshStandardMaterial({ color: "#3a2a1a", emissive: "#ffcf96", emissiveIntensity: 1.6 });
      for (let i = 0; i < 16; i++) {
        const z = -80 + i * 6.5;
        garages.add(at(new THREE.Mesh(crease(rbox(0.8, 4.6, 1.2, 0.03)), facade), -7.4, 2.3, z));
        // lit interior seen through the opening
        const back = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 3.4), warm);
        back.position.set(-10.5, 1.7, z + 3.25);
        back.rotation.y = Math.PI / 2;
        garages.add(back);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 5.2), std("#4a3e33", 0.4));
        floor.rotation.set(-Math.PI / 2, 0, 0);
        floor.position.set(-8.9, 0.01, z + 3.25);
        garages.add(floor);
        // roller door half raised
        const door = new THREE.Mesh(rbox(0.1, 1.4, 5.2, 0.01), std("#7f8386", 0.45, 0.4));
        door.position.set(-7.5, 3.0, z + 3.25);
        garages.add(door);
        for (let s = 0; s < 6; s++) garages.add(at(new THREE.Mesh(rbox(0.03, 0.02, 5.2, 0.005), std("#5d6164", 0.5, 0.4)), -7.44, 2.4 + s * 0.22, z + 3.25));
        if (i > 10 && i < 15) {
          const lamp = new THREE.PointLight(0xffc68a, 14, 9, 1.6);
          lamp.position.set(-7.8, 2.2, z + 3.25);
          garages.add(lamp);
        }
      }
      const canopy = new THREE.Mesh(crease(rbox(3.2, 0.3, 110, 0.04)), facade);
      canopy.position.set(-6.4, 4.75, -32);
      garages.add(canopy);
      garages.add(at(new THREE.Mesh(crease(rbox(6, 6, 110, 0.04)), facade), -13.6, 3, -32));
      scene.add(shadowed(garages));

      // ------------------------------------------------------------- Mount Fuji in the mist
      // concave volcano profile, lathed; the snowfield is a second, slightly larger lathe on top
      const prof = (k) => [[0, 1], [0.06, 0.985], [0.18, 0.86], [0.34, 0.64], [0.55, 0.38], [0.78, 0.15], [1, 0.02], [1.15, 0]].map(([r, h]) => new THREE.Vector2(r * k, h));
      const fuji = new THREE.Mesh(new THREE.LatheGeometry(prof(1), 128), new THREE.MeshBasicMaterial({ color: "#5f6770", fog: false }));
      fuji.scale.set(330, 125, 330);
      fuji.position.set(-20, 0, -900);
      scene.add(fuji);
      const snowProf = [[0, 1.003], [0.06, 0.988], [0.18, 0.863], [0.26, 0.75], [0.22, 0.74], [0.12, 0.8], [0, 0.82]].map(([r, h]) => new THREE.Vector2(r * 1.004, h));
      const snow = new THREE.Mesh(new THREE.LatheGeometry(snowProf, 128), new THREE.MeshBasicMaterial({ color: "#aeb5bc", fog: false, side: THREE.DoubleSide }));
      snow.scale.copy(fuji.scale);
      snow.position.copy(fuji.position);
      scene.add(snow);

      // pit-exit gantry: the red light he will not drive past
      const gantry = new THREE.Group();
      const gMat = std("#4b4f53", 0.5, 0.4);
      gantry.add(at(new THREE.Mesh(crease(rbox(0.3, 5.8, 0.3, 0.03)), gMat), -6.2, 2.9, 0));
      gantry.add(at(new THREE.Mesh(crease(rbox(0.3, 5.8, 0.3, 0.03)), gMat), 2.6, 2.9, 0));
      gantry.add(at(new THREE.Mesh(crease(rbox(9.1, 0.35, 0.4, 0.03)), gMat), -1.8, 5.7, 0));
      const lens = new THREE.MeshStandardMaterial({ color: "#300404", emissive: "#ff2010", emissiveIntensity: 2.4 });
      for (const lx of [-0.6, 0.3]) {
        gantry.add(at(new THREE.Mesh(crease(rbox(0.5, 0.95, 0.35, 0.05)), std("#141414", 0.5)), lx, 5.0, 0.15));
        gantry.add(at(new THREE.Mesh(new THREE.CircleGeometry(0.15, 32), lens), lx, 5.22, 0.33));
        gantry.add(at(new THREE.Mesh(new THREE.CircleGeometry(0.15, 32), lens), lx, 4.82, 0.33));
      }
      const glow = new THREE.PointLight(0xff3020, 30, 14, 1.8);
      glow.position.set(-0.15, 5.0, 0.8);
      gantry.add(glow);
      gantry.position.z = -26;
      scene.add(shadowed(gantry));

      // ------------------------------------------------------------- the cars
      const hero = buildCar(ACCENT, "1");
      hero.position.set(-1.55, 0, -1.4);
      hero.rotation.y = Math.PI - 0.42;
      scene.add(hero);

      const rival = buildCar(RIVAL, "11");
      rival.position.set(4.9, 0, -21);
      scene.add(rival);
      // spray plume behind the rival: hundreds of soft translucent puffs widening with distance
      const sprayGeo = new THREE.SphereGeometry(1, 14, 10);
      const sprayMat = new THREE.MeshStandardMaterial({ color: "#c6ccd2", transparent: true, opacity: 0.035, roughness: 1, depthWrite: false });
      const spray = new THREE.InstancedMesh(sprayGeo, sprayMat, 420);
      const dm = new THREE.Object3D();
      for (let i = 0; i < 420; i++) {
        const d = Math.pow(rnd(), 0.7) * 14;
        const side = rnd() < 0.5 ? -0.88 : 0.88;
        dm.position.set(4.9 + side * (1 - d / 20) + (rnd() - 0.5) * d * 0.45, 0.2 + rnd() * (0.5 + d * 0.16), -19.6 + d);
        dm.scale.setScalar(0.2 + d * 0.05 + rnd() * 0.2);
        dm.updateMatrix();
        spray.setMatrixAt(i, dm.matrix);
      }
      scene.add(spray);

      // ------------------------------------------------------------- people
      // Lauda: red suit, balaclava, back to us, helmet hanging from his right hand, facing the track.
      const lauda = buildPerson(ACCENT, {
        balaclava: true,
        gloves: true,
        arms: { "-1": { reach: 0.08, bend: 0.12, spread: 0.16, grip: 0.9 }, "1": { reach: 0.05, bend: 0.2, spread: 0.08 } },
      });
      lauda.position.set(1.1, 0, 3.9);
      lauda.rotation.y = Math.PI - 0.38;
      const held = buildHelmet(0.155);
      const hp = lauda.userData.hands[-1];
      held.position.set(hp.x - 0.03, hp.y - 0.17, hp.z + 0.02);
      held.rotation.set(0.25, -Math.PI / 2 + 0.3, 0.15);
      lauda.add(held);
      scene.add(lauda);

      // mechanic by the car holding an umbrella over the cockpit, another at the nose watching him go
      const mech = buildPerson("#2f3236", { gloves: false, arms: { "1": { reach: 1.25, bend: 1.0, spread: 0.1, grip: 0.9 } } });
      mech.position.set(-2.95, 0, 0.35);
      mech.rotation.y = Math.PI / 2 + 0.6;
      scene.add(mech);
      const umb = new THREE.Group();
      const handPos = mech.userData.hands[1];
      umb.add(rod(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1.05, 0), 0.012, std("#2a2a2a", 0.4, 0.5)));
      const canopyMat = new THREE.MeshPhysicalMaterial({ color: "#191a1c", roughness: 0.3, clearcoat: 1, side: THREE.DoubleSide });
      const shade = new THREE.Mesh(new THREE.SphereGeometry(0.62, 48, 12, 0, Math.PI * 2, 0, 0.95), canopyMat);
      shade.scale.y = 0.55;
      shade.position.y = 0.72;
      umb.add(shade);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        umb.add(rod(new THREE.Vector3(0, 1.0, 0), new THREE.Vector3(Math.cos(a) * 0.5, 0.78, Math.sin(a) * 0.5), 0.005, std("#555", 0.4, 0.6), 4));
      }
      umb.position.copy(handPos);
      umb.rotation.set(0.15, 0, -0.25);
      mech.add(umb);
      const watcher = buildPerson("#3d4044", { arms: { "1": { reach: 0.35, bend: 1.9, spread: 0.35 }, "-1": { reach: 0.35, bend: 1.9, spread: 0.35 } } });
      watcher.position.set(-0.55, 0, -3.9);
      watcher.rotation.y = 0.35;
      scene.add(watcher);

      // ------------------------------------------------------------- rain
      const streakGeo = new THREE.BoxGeometry(0.0022, 0.42, 0.0022);
      const streakMat = new THREE.MeshBasicMaterial({ color: "#e9eef3", transparent: true, opacity: 0.16, depthWrite: false });
      const RAIN = 9000;
      const rain = new THREE.InstancedMesh(streakGeo, streakMat, RAIN);
      for (let i = 0; i < RAIN; i++) {
        const z = 7.0 - Math.pow(rnd(), 1.4) * 60; // nothing closer than ~3 m to the lens
        const depth = 10.2 - z;
        const spread = depth * 0.42;
        dm.position.set(1.6 + (rnd() - 0.5) * spread * 2, rnd() * (1.5 + depth * 0.55), z);
        dm.rotation.set(0.05, 0, 0.13 + (rnd() - 0.5) * 0.04);
        dm.scale.set(1, 0.7 + rnd() * 0.6, 1);
        dm.updateMatrix();
        rain.setMatrixAt(i, dm.matrix);
      }
      scene.add(rain);
      // splash crowns on the ground
      const crown = new THREE.InstancedMesh(new THREE.TorusGeometry(0.022, 0.0025, 3, 14), new THREE.MeshBasicMaterial({ color: "#dfe4e9", transparent: true, opacity: 0.22, depthWrite: false }), 1400);
      for (let i = 0; i < 1400; i++) {
        const z = 8.0 - Math.pow(rnd(), 1.3) * 24;
        dm.position.set(1 + (rnd() - 0.5) * (4 + (6.5 - z) * 0.9), 0.012, z);
        dm.rotation.set(Math.PI / 2, 0, 0);
        dm.scale.set(0.6 + rnd(), 0.6 + rnd(), 0.4);
        dm.updateMatrix();
        crown.setMatrixAt(i, dm.matrix);
      }
      scene.add(crown);

      // ------------------------------------------------------------- post
      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1);
      composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      const random = Math.random;
      Math.random = rnd; // seeded noise inside GTAO
      const gtao = new GTAOPass(scene, camera, W, H);
      Math.random = random;
      gtao.updateGtaoMaterial({ radius: 0.5, distanceExponent: 1.5, thickness: 1.2, scale: 1.0 });
      composer.addPass(gtao);
      const focus = camera.position.distanceTo(new THREE.Vector3(1.1, 1.3, 3.9));
      composer.addPass(new BokehPass(scene, camera, { focus, aperture: 0.0016, maxblur: 0.005 }));
      composer.addPass(new OutputPass());
      composer.addPass(new ShaderPass({
        uniforms: { tDiffuse: { value: null }, res: { value: new THREE.Vector2(W, H) } },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
        fragmentShader: `
          uniform sampler2D tDiffuse; uniform vec2 res; varying vec2 vUv;
          float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
          void main(){
            vec2 c = vUv - 0.5;
            float ca = 0.0012 * length(c);
            vec3 col = vec3(texture2D(tDiffuse, vUv + c*ca).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - c*ca).b);
            col = mix(col, col * vec3(0.94, 0.99, 1.04), 0.6);           // cool storm grade
            col = (col - 0.5) * 1.08 + 0.5;                                // a touch of contrast
            col *= 1.0 - smoothstep(0.35, 0.95, length(c * vec2(0.9, 1.1))) * 0.55; // vignette
            col += (hash(vUv * res) - 0.5) * 0.045;                        // film grain
            gl_FragColor = vec4(col, 1.0);
          }`,
      }));

      requestAnimationFrame(() => {
        composer.render();
        window.__done = true;
      });
    </script>
  </body>
</html>
