<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"accent","type":"color","label":"Hero accent","default":"#d7262b"},{"id":"caption1","type":"string","label":"Shot 1 caption","default":"42 DAYS LATER"},{"id":"caption3","type":"string","label":"Shot 3 caption","default":"HE WAS RACING AGAIN"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script type="importmap">
      { "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
    </script>
    <script src="lib/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f2f2f0;
        --ink: #141414;
        --accent: #d7262b;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
      #stage {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      #stage-canvas {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .ui {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .caption {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        color: var(--ink);
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .caption span {
        display: inline-block;
        white-space: pre;
      }
      .caption .hot {
        color: var(--accent);
      }
      #cap-1 {
        top: 1250px;
        font-size: 92px;
      }
      #cap-3 {
        top: 300px;
        font-size: 88px;
      }
      #counter {
        position: absolute;
        left: 50%;
        top: 1090px;
        width: 360px;
        margin-left: -180px;
        padding: 26px 0 22px;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 10px 34px rgba(20, 20, 20, 0.14);
        text-align: center;
        color: var(--ink);
        font-weight: 900;
        font-size: 84px;
        letter-spacing: -0.02em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="0" data-track-kind="graphics">
        <canvas id="stage-canvas" width="1080" height="1920"></canvas>
      </div>

      <!-- Shot 1: top-down, counter ticks to day 42 -->
      <div id="ui-1" class="ui clip" data-start="0" data-duration="1.9" data-track-index="1" data-track-kind="graphics">
        <div id="counter">DAY 0</div>
        <h1 id="cap-1" class="caption" data-var-text="caption1">42 DAYS LATER</h1>
      </div>

      <!-- Voiceover (Kokoro, bm_george) -->
      <audio id="vo-1" class="clip" src="assets/audio/vo-1.wav" data-start="0.1" data-duration="2.03" data-track-index="10" data-volume="1.4"></audio>
      <audio id="vo-2" class="clip" src="assets/audio/vo-2.wav" data-start="3.42" data-duration="1.58" data-track-index="11" data-volume="1.4"></audio>

      <!-- Sound effects (tools/make_sfx.py) -->
      <audio id="sfx-engine-idle" class="clip" src="assets/audio/sfx-engine-idle.wav" data-start="0" data-duration="3.3" data-track-index="12" data-volume="0.1"></audio>
      <audio id="sfx-ticks" class="clip" src="assets/audio/sfx-ticks.wav" data-start="0" data-duration="1.5" data-track-index="13" data-volume="0.35"></audio>
      <audio id="sfx-whoosh-a" class="clip" src="assets/audio/sfx-whoosh-a.wav" data-start="1.6" data-duration="0.55" data-track-index="14" data-volume="0.45"></audio>
      <audio id="sfx-helmet" class="clip" src="assets/audio/sfx-helmet.wav" data-start="1.9" data-duration="1.3" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-whoosh-b" class="clip" src="assets/audio/sfx-whoosh-b.wav" data-start="3.0" data-duration="0.55" data-track-index="16" data-volume="0.45"></audio>
      <audio id="sfx-launch" class="clip" src="assets/audio/sfx-launch.wav" data-start="3.3" data-duration="1.7" data-track-index="17" data-volume="0.2"></audio>

      <!-- Shot 3: launch -->
      <div id="ui-3" class="ui clip" data-start="3.3" data-duration="1.7" data-track-index="2" data-track-kind="graphics">
        <h1 id="cap-3" class="caption" data-var-text="caption3">HE WAS RACING AGAIN</h1>
      </div>
    </div>

    <script>
      // Split a caption into words; words containing a digit or "RACING" take the accent.
      function splitWords(el) {
        const words = el.textContent.split(/(\s+)/).filter((p) => p.length);
        el.textContent = "";
        return words
          .map((w) => {
            const s = document.createElement("span");
            s.textContent = w;
            if (/\d|RACING/.test(w)) s.className = "hot";
            el.appendChild(s);
            return s;
          })
          .filter((s) => s.textContent.trim().length);
      }

      const cap1 = splitWords(document.getElementById("cap-1"));
      const cap3 = splitWords(document.getElementById("cap-3"));
      const counter = document.getElementById("counter");
      const days = { n: 0 };

      const tl = gsap.timeline({ paused: true });

      // Shot 1 (0 – 1.9): counter lands, ticks 0 → 42, caption blurs in word by word
      tl.fromTo("#counter", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 0.1);
      tl.fromTo(
        days,
        { n: 0 },
        {
          n: 42,
          duration: 1.0,
          ease: "power2.inOut",
          onUpdate: () => (counter.textContent = "DAY " + Math.round(days.n)),
        },
        0.35,
      );
      tl.fromTo(
        cap1,
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.08 },
        0.75,
      );

      // Shot 3 (3.3 – 5.0): caption lands as the car launches
      tl.fromTo(
        cap3,
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.08 },
        3.35,
      );

      window.__timelines["main"] = tl;
      tl.seek(0);

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.stage = new Promise((resolve) => (window.__stageBuilt = resolve));
    </script>

    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
      import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { GROUND, ACCENT, RIVAL, buildCar, buildTrack, buildGarage, spinWheels } from "./scene/models.js";
      import { buildDriver, buildPerson } from "./scene/humans.js";

      const SHOT2_START = 1.9;
      const SHOT3_START = 3.3;
      const GARAGE_X = 60;
      const W = 1080, H = 1920;

      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const outCubic = (x) => 1 - Math.pow(1 - x, 3);
      const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const lerp = (a, b, k) => a + (b - a) * k;

      const canvas = document.getElementById("stage-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(GROUND);
      scene.fog = new THREE.Fog(GROUND, 30, 110);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.6;

      const camera = new THREE.PerspectiveCamera(40, W / H, 0.02, 300);

      // Hard, low key light for long, crisp shadows; a cool hemisphere fill; a rim spot for the garage.
      const hemi = new THREE.HemisphereLight(0xf4f6ff, 0xb9b7b2, 1.1);
      scene.add(hemi);
      const key = new THREE.DirectionalLight(0xfff6ea, 3.2);
      key.castShadow = true;
      key.shadow.mapSize.set(4096, 4096);
      key.shadow.radius = 2.5;
      key.shadow.bias = -0.0003;
      key.shadow.normalBias = 0.015;
      scene.add(key, key.target);
      const rim = new THREE.SpotLight(0xffffff, 0, 12, 0.5, 0.6, 1.2);
      rim.castShadow = false;
      scene.add(rim, rim.target);

      buildTrack(scene);

      // Lauda's red #1 with crew around it, rivals in grey ahead and behind.
      const hero = buildCar(ACCENT, "1");
      hero.position.set(-1.5, 0, 0);
      const rivalAhead = buildCar(RIVAL, "11");
      rivalAhead.position.set(1.5, 0, -7);
      const rivalBehind = buildCar(RIVAL, "3");
      rivalBehind.position.set(1.5, 0, 9.5);
      scene.add(hero, rivalAhead, rivalBehind);
      const crew = [
        [buildPerson("#3b3d40", { reach: 0.5, bend: 1.0 }), -2.95, -1.6, 1.2],
        [buildPerson("#4a4c50", { reach: 0.15, bend: 0.3 }), -2.75, 0.7, Math.PI / 2],
        [buildPerson("#2f3134", { reach: 0.3, bend: 1.3, spread: 0.25 }), -0.15, 2.3, -2.3],
        [buildPerson("#55575b"), 2.9, -4.6, -1.2],
      ].map(([p, x, z, ry]) => {
        p.position.set(x, 0, z);
        p.rotation.y = ry;
        scene.add(p);
        return p;
      });

      // Shot 2 set: the driver in a dark garage, pulling his helmet on.
      buildGarage(scene, GARAGE_X);
      const driver = buildDriver();
      driver.position.set(GARAGE_X, 0.55, 0);
      scene.add(driver);

      // Shot 3: wheelspin smoke, each puff born at a fixed time so any frame stands alone.
      const puffs = [];
      for (let i = 0; i < 60; i++) {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(0.16, 16, 12),
          new THREE.MeshStandardMaterial({ color: "#f2f2f0", transparent: true, roughness: 1, depthWrite: false }),
        );
        m.userData = { born: (i >> 1) * 0.022, side: i % 2 ? 1 : -1, drift: ((i * 37) % 11) / 11 - 0.5 };
        m.visible = false;
        scene.add(m);
        puffs.push(m);
      }
      const launchDistance = (u) => 0.5 * 11 * u * u;

      // Post: render → ambient occlusion → depth of field (garage only) → tone map.
      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1);
      composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      const random = Math.random;
      let seed = 7;
      Math.random = () => ((seed = (seed * 16807) % 2147483647) / 2147483647); // seeded noise for GTAO
      const gtao = new GTAOPass(scene, camera, W, H);
      Math.random = random;
      gtao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.6, thickness: 1.5, scale: 1.1 });
      composer.addPass(gtao);
      const bokeh = new BokehPass(scene, camera, { focus: 1.3, aperture: 0.006, maxblur: 0.012 });
      composer.addPass(bokeh);
      composer.addPass(new OutputPass());

      const target = new THREE.Vector3();
      const helmetWorld = new THREE.Vector3();
      function frameKeyLight(x, z, span, dir) {
        key.position.set(x + dir[0], dir[1], z + dir[2]);
        key.target.position.set(x, 0, z);
        Object.assign(key.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 1, far: 80 });
        key.shadow.camera.updateProjectionMatrix();
      }

      function renderAt(t) {
        puffs.forEach((p) => (p.visible = false));
        rim.intensity = 0;
        bokeh.enabled = false;
        gtao.enabled = true;
        if (t < SHOT2_START) {
          // Shot 1: straight top-down on the grid, slowly sinking; car points up the screen.
          const u = t / SHOT2_START;
          camera.fov = 40;
          camera.up.set(0, 0, -1);
          camera.position.set(-1.5, lerp(18.5, 16.5, inOut(u)), 2.2);
          target.set(-1.5, 0, 2.2);
          camera.lookAt(target);
          rivalAhead.visible = true;
          crew.forEach((c) => (c.visible = true));
          hero.position.z = 0;
          spinWheels(hero, 0);
          frameKeyLight(-1.5, 1.5, 10, [-9, 14, -5]);
          key.intensity = 3.2;
          hemi.intensity = 1.1;
        } else if (t < SHOT3_START) {
          // Shot 2: low angle looking up as the gloves pull the helmet over the balaclava.
          const u = t - SHOT2_START;
          const k = outCubic(clamp01(u / 1.1));
          driver.userData.pose(lerp(1.0, 0.615, k), lerp(0.35, 0, k));
          camera.fov = 34;
          camera.up.set(0, 1, 0);
          camera.position.set(GARAGE_X + lerp(0.52, 0.44, u / 1.4), lerp(1.2, 1.16, u / 1.4), lerp(1.3, 1.16, u / 1.4));
          target.set(GARAGE_X, lerp(1.36, 1.2, k), 0);
          camera.lookAt(target);
          frameKeyLight(GARAGE_X, 0, 4, [-2.5, 4, 3]);
          key.intensity = 2.4;
          hemi.intensity = 0.35;
          rim.intensity = 60;
          rim.position.set(GARAGE_X + 1.2, 2.6, -1.6);
          rim.target.position.set(GARAGE_X, 1.2, 0);
          driver.updateMatrixWorld(true);
          driver.children.find((c) => c.isGroup && c.children.length > 8)?.getWorldPosition(helmetWorld);
          bokeh.enabled = true;
          bokeh.uniforms.focus.value = camera.position.distanceTo(helmetWorld.lengthSq() ? helmetWorld : target);
        } else {
          // Shot 3: low from behind; tyre smoke at launch, under the red start lights.
          const u = t - SHOT3_START;
          const s = launchDistance(u);
          hero.position.z = -s;
          spinWheels(hero, s * 1.25);
          rivalAhead.visible = false;
          crew.forEach((c) => (c.visible = false));
          for (const p of puffs) {
            const age = u - p.userData.born;
            if (age < 0 || p.userData.born > 0.65) continue;
            p.visible = true;
            p.position.set(
              -1.5 + p.userData.side * (0.95 + age * 0.7) + p.userData.drift * 0.35,
              0.2 + age * 0.5,
              -launchDistance(p.userData.born) + 1.75 + age * 0.8,
            );
            p.scale.setScalar(0.4 + age * 1.2);
            p.material.opacity = Math.max(0, 0.32 - age * 0.38);
          }
          const c = outCubic(clamp01(u / 1.7));
          camera.fov = 50;
          camera.up.set(0, 1, 0);
          camera.position.set(-0.4, 0.8, lerp(7.4, 5.6, c));
          target.set(-1.2, 1.2, lerp(-4.0, -9.0, c));
          camera.lookAt(target);
          frameKeyLight(-1.5, -s - 4, 14, [-9, 12, -6]);
          key.intensity = 3.2;
          hemi.intensity = 1.1;
        }
        camera.updateProjectionMatrix();
        composer.render();
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
      window.__stageBuilt();
    </script>
  </body>
</html>
