<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"accent","type":"color","label":"Hero accent","default":"#d7262b"},{"id":"caption1","type":"string","label":"Shot 1 caption","default":"42 DAYS LATER"},{"id":"caption3","type":"string","label":"Shot 3 caption","default":"HE WAS RACING AGAIN"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="lib/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f2f2f0;
        --ink: #141414;
        --accent: #d7262b;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
      #stage {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      #stage-canvas {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .ui {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .caption {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        color: var(--ink);
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .caption span {
        display: inline-block;
        white-space: pre;
      }
      .caption .hot {
        color: var(--accent);
      }
      #cap-1 {
        top: 1250px;
        font-size: 92px;
      }
      #cap-3 {
        top: 300px;
        font-size: 88px;
      }
      #counter {
        position: absolute;
        left: 50%;
        top: 1090px;
        width: 360px;
        margin-left: -180px;
        padding: 26px 0 22px;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 10px 34px rgba(20, 20, 20, 0.14);
        text-align: center;
        color: var(--ink);
        font-weight: 900;
        font-size: 84px;
        letter-spacing: -0.02em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="0" data-track-kind="graphics">
        <canvas id="stage-canvas" width="1080" height="1920"></canvas>
      </div>

      <!-- Shot 1: top-down, counter ticks to day 42 -->
      <div id="ui-1" class="ui clip" data-start="0" data-duration="1.9" data-track-index="1" data-track-kind="graphics">
        <div id="counter">DAY 0</div>
        <h1 id="cap-1" class="caption" data-var-text="caption1">42 DAYS LATER</h1>
      </div>

      <!-- Shot 3: launch -->
      <div id="ui-3" class="ui clip" data-start="3.3" data-duration="1.7" data-track-index="2" data-track-kind="graphics">
        <h1 id="cap-3" class="caption" data-var-text="caption3">HE WAS RACING AGAIN</h1>
      </div>
    </div>

    <script>
      // Split a caption into words; words containing a digit or "RACING" take the accent.
      function splitWords(el) {
        const words = el.textContent.split(/(\s+)/).filter((p) => p.length);
        el.textContent = "";
        return words
          .map((w) => {
            const s = document.createElement("span");
            s.textContent = w;
            if (/\d|RACING/.test(w)) s.className = "hot";
            el.appendChild(s);
            return s;
          })
          .filter((s) => s.textContent.trim().length);
      }

      const cap1 = splitWords(document.getElementById("cap-1"));
      const cap3 = splitWords(document.getElementById("cap-3"));
      const counter = document.getElementById("counter");
      const days = { n: 0 };

      const tl = gsap.timeline({ paused: true });

      // Shot 1 (0 – 1.9): counter lands, ticks 0 → 42, caption blurs in word by word
      tl.fromTo("#counter", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 0.1);
      tl.fromTo(
        days,
        { n: 0 },
        {
          n: 42,
          duration: 1.0,
          ease: "power2.inOut",
          onUpdate: () => (counter.textContent = "DAY " + Math.round(days.n)),
        },
        0.35,
      );
      tl.fromTo(
        cap1,
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.08 },
        0.75,
      );

      // Shot 3 (3.3 – 5.0): caption lands as the car launches
      tl.fromTo(
        cap3,
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.08 },
        3.35,
      );

      window.__timelines["main"] = tl;
      tl.seek(0);

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.stage = new Promise((resolve) => (window.__stageBuilt = resolve));
    </script>

    <script type="module">
      import * as THREE from "./lib/three.module.js";
      import { GROUND, ACCENT, RIVAL, buildCar, buildDriver, buildTrack, spinWheels, mat } from "./scene/models.js";

      const SHOT2_START = 1.9;
      const SHOT3_START = 3.3;

      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const outCubic = (x) => 1 - Math.pow(1 - x, 3);
      const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const lerp = (a, b, k) => a + (b - a) * k;

      const canvas = document.getElementById("stage-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1080, 1920, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(GROUND);
      scene.fog = new THREE.Fog(GROUND, 24, 70);

      const camera = new THREE.PerspectiveCamera(40, 1080 / 1920, 0.02, 250);

      // Soft overcast studio light: big hemisphere fill + one soft key for contact shadows.
      scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d8d4, 2.0));
      const key = new THREE.DirectionalLight(0xffffff, 1.7);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });
      key.shadow.radius = 5;
      key.shadow.bias = -0.0004;
      key.shadow.normalBias = 0.02;
      scene.add(key, key.target);

      buildTrack(scene);

      // Lauda's red #1 on the grid, rivals in grey ahead and behind.
      const hero = buildCar(ACCENT, "1");
      hero.position.set(-1.5, 0, 0);
      const rivalAhead = buildCar(RIVAL, "11");
      rivalAhead.position.set(1.5, 0, -7);
      const rivalBehind = buildCar(RIVAL, "3");
      rivalBehind.position.set(1.5, 0, 9.5);
      scene.add(hero, rivalAhead, rivalBehind);

      // Shot 2 set: the driver pulling his helmet on, off to one side of the world.
      const driver = buildDriver();
      driver.position.set(40, 0, 0);
      scene.add(driver);

      // Shot 3: wheelspin smoke, puffs born at fixed times so any frame can be drawn alone.
      const puffs = [];
      for (let i = 0; i < 48; i++) {
        const m = new THREE.Mesh(
          new THREE.IcosahedronGeometry(0.16, 0),
          new THREE.MeshStandardMaterial({ color: "#ffffff", flatShading: true, transparent: true, roughness: 1 }),
        );
        m.userData = { born: (i >> 1) * 0.028, side: i % 2 ? 1 : -1, spin: 0.7 + (i % 5) * 0.31, drift: ((i * 37) % 11) / 11 - 0.5 };
        m.visible = false;
        scene.add(m);
        puffs.push(m);
      }
      const launchDistance = (u) => 0.5 * 11 * u * u; // constant acceleration from rest

      const target = new THREE.Vector3();
      function frameKeyLight(x, z) {
        key.position.set(x + 5, 14, z + 4);
        key.target.position.set(x, 0, z);
      }

      function renderAt(t) {
        puffs.forEach((p) => (p.visible = false));
        if (t < SHOT2_START) {
          // Shot 1: straight top-down on the grid, slowly sinking; the car points up the screen.
          const u = t / SHOT2_START;
          const h = lerp(18.5, 16.5, inOut(u));
          camera.fov = 40;
          camera.up.set(0, 0, -1);
          camera.position.set(-1.5, h, 2.2);
          target.set(-1.5, 0, 2.2);
          camera.lookAt(target);
          rivalAhead.visible = true;
          hero.position.z = 0;
          spinWheels(hero, 0);
          frameKeyLight(-1.5, 0);
        } else if (t < SHOT3_START) {
          // Shot 2: the gloves pull the helmet down over the balaclava.
          const u = t - SHOT2_START;
          const k = outCubic(clamp01(u / 1.1));
          driver.userData.pose(lerp(1.0, 0.645, k), lerp(0.35, 0, k));
          camera.fov = 32;
          camera.up.set(0, 1, 0);
          camera.position.set(40 + lerp(0.62, 0.55, u / 1.4), lerp(0.86, 0.8, u / 1.4), lerp(1.45, 1.32, u / 1.4));
          target.set(40, lerp(0.74, 0.68, k), 0);
          camera.lookAt(target);
          frameKeyLight(40, 0);
        } else {
          // Shot 3: rear three-quarter, low; the car launches and shrinks down the straight.
          const u = t - SHOT3_START;
          const s = launchDistance(u);
          hero.position.z = -s;
          spinWheels(hero, s * 1.25);
          rivalAhead.visible = false;
          for (const p of puffs) {
            const age = u - p.userData.born;
            if (age < 0 || p.userData.born > 0.6) continue;
            const sz = launchDistance(p.userData.born);
            p.visible = true;
            p.position.set(-1.5 + p.userData.side * (0.95 + age * 0.6) + p.userData.drift * 0.3, 0.18 + age * 0.45, -sz + 1.75 + age * 1.6);
            const sc = 0.35 + age * 1.5;
            p.scale.setScalar(sc);
            p.rotation.set(age * p.userData.spin, age * 1.3, 0);
            p.material.opacity = Math.max(0, 0.5 - age * 0.45);
          }
          const c = outCubic(clamp01(u / 1.7));
          camera.fov = 38;
          camera.up.set(0, 1, 0);
          camera.position.set(-0.2, 1.05, lerp(9.0, 6.8, c));
          target.set(-1.5, 0.5, lerp(-1.0, -6.0, c));
          camera.lookAt(target);
          frameKeyLight(-1.5, -s);
        }
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
      window.__stageBuilt();
    </script>
  </body>
</html>
